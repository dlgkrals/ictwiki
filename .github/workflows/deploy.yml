name: Spring Boot Deploy (All in GitHub Actions)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Java 17 (Corretto)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Spring Boot
        run: ./gradlew clean build -x test

      # application-prod.yml 생성
      - name: Create application-prod.yml
        run: |
          mkdir -p src/main/resources
          cat << 'EOF' > src/main/resources/application-prod.yml
          ${{ secrets.APPLICATION_PROD_YML }}
          EOF

      # JAR만 EC2로 전송
      - name: Upload jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "~/app"

      # EC2에서 모든 배포 처리
      - name: Deploy on EC2 (inline)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            APP_DIR=~/app
            APP_NAME=app.jar
            PORT=8080

            cd $APP_DIR

            echo "🔹 Stop existing Spring Boot"
            PID=$(lsof -ti tcp:$PORT || true)
            if [ -n "$PID" ]; then
              kill $PID
              sleep 5
            fi

            echo "🔹 Replace jar"
            JAR_FILE=$(ls *.jar | head -n 1)
            mv $JAR_FILE $APP_NAME

            echo "🔹 Start Spring Boot"
            nohup java -jar $APP_NAME \
              --spring.profiles.active=prod \
              > app.log 2>&1 &
