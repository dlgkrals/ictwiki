name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Create application-prod.yml
        run: |
          mkdir -p src/main/resources
          cat > src/main/resources/application-prod.yml << 'EOF'
          ${{ secrets.APPLICATION_PROD_YML }}
          EOF

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/wiki-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/ictwiki/"
          strip_components: 2

      - name: Deploy on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -x
            echo "=== [DEBUG] SSH 세션 시작 ======================================="
            echo "현재 디렉토리: $(/bin/pwd)"
            echo "현재 사용자: $(whoami)"
            echo "홈 디렉토리: $HOME"
            echo "JAVA_HOME: ${JAVA_HOME:-없음}"
            echo "PATH 일부: ${PATH:0:100}..."

            echo ""
            echo "=== [DEBUG] 기존 프로세스 상태 확인 =============================="
            echo "pgrep 결과 (전체):"
            pgrep -f wiki-0.0.1-SNAPSHOT.jar -a || echo "(없음)"
            echo ""
            echo "ps aux | grep wiki 결과:"
            ps aux | grep -i wiki | grep -v grep || echo "(매칭되는 프로세스 없음)"

            set +e
            echo ""
            echo "=== [DEBUG] 프로세스 종료 시도 ==================================="
            echo "kill 명령 실행 전:"
            pgrep -f wiki-0.0.1-SNAPSHOT.jar | xargs -r echo "→ 종료 대상 PID:" || echo "(대상 없음)"

            pgrep -f wiki-0.0.1-SNAPSHOT.jar | xargs -r kill
            KILL_EXIT=$?
            echo "kill 명령 exit code: $KILL_EXIT"
            if [ $KILL_EXIT -eq 0 ]; then
              echo "→ kill 성공 (프로세스 종료됨)"
            elif [ $KILL_EXIT -eq 123 ]; then
              echo "→ xargs kill: 일부 프로세스만 종료됨"
            else
              echo "→ kill 관련 에러 발생 (또는 대상 없음)"
            fi

            echo "종료 후 3초 대기"
            sleep 3

            echo ""
            echo "=== [DEBUG] kill 후 프로세스 잔여 확인 ==========================="
            pgrep -f wiki-0.0.1-SNAPSHOT.jar -a || echo "(남은 프로세스 없음)"
            ps aux | grep -i wiki | grep -v grep || echo "(매칭 없음)"

            set -e

            echo ""
            echo "=== [DEBUG] 새 애플리케이션 시작 =================================="
            cd /home/ubuntu/ictwiki || { echo "!!! cd 실패 !!!"; exit 2; }
            echo "cd 후 현재 디렉토리: $(pwd)"

            echo "JAR 파일 확인:"
            ls -l wiki-0.0.1-SNAPSHOT.jar || { echo "!!! JAR 파일 없음 !!!"; exit 3; }

            echo "nohup java -jar 실행 시작"
            nohup java -jar \
              -Dspring.profiles.active=prod \
              wiki-0.0.1-SNAPSHOT.jar \
              > app.log 2>&1 &
            JAVA_PID=$!
            echo "백그라운드 PID: $JAVA_PID"

            echo "5초 대기"
            sleep 5

            echo ""
            echo "=== [DEBUG] 프로세스 실행 여부 최종 확인 ========================="
            if ps -p "$JAVA_PID" > /dev/null 2>&1; then
              echo "→ 방금 실행한 PID $JAVA_PID 는 살아있음"
            else
              echo "→ 방금 실행한 PID $JAVA_PID 는 이미 종료됨"
            fi

            if ps aux | grep -v grep | grep wiki-0.0.1-SNAPSHOT.jar > /dev/null; then
              echo "✅ 배포 성공!"
              echo "최근 로그 15줄:"
              tail -n 15 app.log || echo "(로그 파일 읽기 실패)"
              exit 0
            else
              echo "❌ 배포 실패"
              echo "app.log 최근 30줄:"
              tail -n 30 app.log || echo "(로그 파일 없거나 읽기 실패)"
              echo ""
              echo "디스크 공간:"
              df -h . || echo "(df 실패)"
              echo ""
              echo "JAR 파일 권한:"
              ls -l wiki-0.0.1-SNAPSHOT.jar || echo "(ls 실패)"
              exit 1
            fi

            echo "=== [DEBUG] 스크립트 종료 ========================================="