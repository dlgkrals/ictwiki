name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Create application-prod.yml
        run: |
          mkdir -p src/main/resources
          cat > src/main/resources/application-prod.yml << 'EOF'
          ${{ secrets.APPLICATION_PROD_YML }}
          EOF

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/wiki-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/ictwiki/"
          strip_components: 2

      - name: Deploy on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -x
            echo "=== [DEBUG] SSH 세션 시작 ======================================="
            echo "현재 디렉토리: $(/bin/pwd)"
            echo "현재 사용자: $(whoami)"
            echo "홈 디렉토리: $HOME"
            echo "JAVA_HOME: ${JAVA_HOME:-없음}"
            echo "PATH 일부: ${PATH:0:100}..."

            echo ""
            echo "=== [DEBUG] 기존 프로세스 상태 확인 =============================="
            echo "pgrep -f wiki 결과 (상세):"
            pgrep -f wiki-0.0.1-SNAPSHOT.jar -a || echo "(없음)"

            echo ""
            echo "실제 java 프로세스만:"
            ps aux | grep "[j]ava.*wiki-0.0.1-SNAPSHOT.jar" || echo "(없음)"

            set +e
            echo ""
            echo "=== [DEBUG] 프로세스 종료 시도 ==================================="
            echo "종료 대상 (java 프로세스만):"
            ps aux | grep "[j]ava.*wiki-0.0.1-SNAPSHOT.jar" | awk '{print $2}' | xargs -r echo "→ PID:"

            # 진짜 종료 명령
            ps aux | grep "[j]ava.*wiki-0.0.1-SNAPSHOT.jar" | awk '{print $2}' | xargs -r kill || true
            echo "kill 후 exit code: $?"

            echo "종료 후 3초 대기"
            sleep 3

            echo ""
            echo "=== [DEBUG] kill 후 잔여 확인 ===================================="
            ps aux | grep "[j]ava.*wiki-0.0.1-SNAPSHOT.jar" || echo "(없음)"

            set -e

            echo ""
            echo "=== [DEBUG] 새 버전 실행 ========================================="
            cd /home/ubuntu/ictwiki || { echo "cd 실패"; exit 1; }
            echo "현재 디렉토리: $(pwd)"
            ls -l wiki-0.0.1-SNAPSHOT.jar || { echo "JAR 없음"; exit 1; }

            nohup java -jar \
              -Dspring.profiles.active=prod \
              wiki-0.0.1-SNAPSHOT.jar \
              > app.log 2>&1 &
            echo "실행 PID: $!"

            sleep 5

            if ps aux | grep -v grep | grep "[j]ava.*wiki-0.0.1-SNAPSHOT.jar" > /dev/null; then
              echo "✅ 배포 성공!"
              tail -15 app.log
              exit 0
            else
              echo "❌ 배포 실패"
              tail -30 app.log
              exit 1
            fi