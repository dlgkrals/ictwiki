name: Deploy to EC2 (Spring Boot)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 17 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      # 3. Gradle 빌드
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      # 4. JAR EC2로 전송
      - name: Copy jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*-SNAPSHOT.jar"
          target: "~/app/build/libs"

      # 5. EC2에서 배포 실행
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            APP_DIR=~/app
            BUILD_DIR=$APP_DIR/build/libs
            APP_NAME=app.jar
            PORT=8080

            mkdir -p $APP_DIR
            mkdir -p $BUILD_DIR

            cd $APP_DIR

            echo "🔹 Create application-prod.yml"
            cat > application-prod.yml << 'EOF'
            ${{ secrets.APPLICATION_PROD_YML }}
            EOF
            chmod 600 application-prod.yml

            echo "🔹 Stop existing Spring Boot"
            PID=$(lsof -ti tcp:$PORT || true)
            if [ -n "$PID" ]; then
              kill $PID
              sleep 5
            fi

            echo "🔹 Replace jar"
            cd $BUILD_DIR
            JAR_FILE=$(ls *-SNAPSHOT.jar | head -n 1)
            mv $JAR_FILE $APP_DIR/$APP_NAME

            cd $APP_DIR

            echo "🔹 Start Spring Boot"
            nohup java -jar $APP_NAME \
              --spring.profiles.active=prod \
              --spring.config.location=file:$APP_DIR/application-prod.yml \
              > app.log 2>&1 &

            echo "✅ Deploy finished"
