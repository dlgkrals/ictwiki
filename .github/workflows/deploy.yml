name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'

      # ⭐ application-prod.yml 생성 (Secret 사용)
      - name: Create application-prod.yml
        run: |
          mkdir -p src/main/resources
          cat > src/main/resources/application-prod.yml << 'EOF'
          ${{ secrets.APPLICATION_PROD_YML }}
          EOF

      # ⭐ 빌드 (설정 파일 포함)
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      # ⭐ JAR 파일만 EC2로 전송
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/wiki-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/ictwiki/"
          strip_components: 2

      # ⭐ EC2에서 실행 (절대 Secret 출력 금지!)
      - name: Deploy on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🛑 기존 프로세스 종료"
            pkill -f wiki-0.0.1-SNAPSHOT.jar || true
            sleep 3
            
            echo "🚀 새 버전 실행"
            cd /home/ubuntu/ictwiki
            nohup java -jar \
              -Dspring.profiles.active=prod \
              wiki-0.0.1-SNAPSHOT.jar \
              > app.log 2>&1 &
            
            echo "⏳ 시작 대기 중..."
            sleep 5
            
            echo "✅ 프로세스 확인"
            if ps aux | grep -v grep | grep wiki-0.0.1-SNAPSHOT.jar > /dev/null; then
              echo "✅ 배포 성공!"
              exit 0
            else
              echo "❌ 배포 실패 - 로그 확인"
              tail -20 app.log
              exit 1
            fi