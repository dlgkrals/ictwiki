name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Create application-prod.yml
        run: |
          mkdir -p src/main/resources
          cat > src/main/resources/application-prod.yml << 'EOF'
          ${{ secrets.APPLICATION_PROD_YML }}
          EOF

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/wiki-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/ictwiki/"
          strip_components: 2

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/ictwiki

            # 기존 프로세스 종료 (포트 기반 - 가장 추천)
            sudo fuser -k -n tcp 8080 || true
            # 필요하면 이름 기반으로도 병행 가능 (주석 해제)
            # pkill -f wiki-0.0.1-SNAPSHOT.jar || true

            # 프로세스가 완전히 종료될 때까지 잠시 대기
            sleep 3

            # 새 JAR 실행
            nohup java -jar \
              -Dspring.profiles.active=prod \
              wiki-0.0.1-SNAPSHOT.jar \
              > app.log 2>&1 &

            echo "새 프로세스 시작됨 (백그라운드)"

            # 시작 후 충분히 기다림 (Spring Boot 초기화 시간 고려)
            sleep 8

            # 프로세스 실행 여부 확인
            if pgrep -f "java.*wiki-0.0.1-SNAPSHOT.jar" > /dev/null; then
              echo "✅ 배포 성공 - 프로세스 실행중"
              echo "최근 로그:"
              tail -n 10 app.log
              exit 0
            else
              echo "❌ 배포 실패 - 프로세스가 실행되지 않음"
              echo "최근 로그:"
              tail -n 30 app.log
              echo ""
              echo "디스크 공간 확인:"
              df -h .
              exit 1
            fi