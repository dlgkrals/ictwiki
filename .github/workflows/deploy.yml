name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Build with Gradle
        run: |
          cd wiki
          chmod +x ./gradlew
          ./gradlew clean build -x test

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "wiki/build/libs/wiki-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/ictwiki/"
          strip_components: 2

      - name: Deploy on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 기존 프로세스 종료
            echo "기존 프로세스 종료 중..."
            pkill -f wiki-0.0.1-SNAPSHOT.jar || true
            sleep 3
            
            # 새 버전 실행
            echo "새 버전 실행 중..."
            cd /home/ubuntu/ictwiki
            nohup java -jar \
              -Dspring.profiles.active=prod \
              -Dspring.config.location=/home/ubuntu/application-prod.yml \
              build/libs/wiki-0.0.1-SNAPSHOT.jar \
              > app.log 2>&1 &
            
            # 헬스 체크
            echo "헬스 체크 중..."
            for i in {1..30}; do
              if curl -f http://localhost:8080/api/test/public > /dev/null 2>&1; then
                echo "배포 성공!"
                exit 0
              fi
              echo "대기 중... ($i/30)"
              sleep 2
            done
            
            echo "배포 실패 - 헬스 체크 타임아웃"
            exit 1