name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Create application-prod.yml
        run: |
          mkdir -p src/main/resources
          cat > src/main/resources/application-prod.yml << 'EOF'
          ${{ secrets.APPLICATION_PROD_YML }}
          EOF

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/wiki-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/ictwiki/"
          strip_components: 2

      - name: Deploy on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set +e
            echo "🛑 기존 프로세스 종료"
            # 프로세스가 있으면 SIGTERM 보내고, 없어도 에러 무시
            pgrep -f wiki-0.0.1-SNAPSHOT.jar | xargs -r kill || true
            # 또는 더 강하게 종료하고 싶을 때 (필요 시 주석 해제)
            # pgrep -f wiki-0.0.1-SNAPSHOT.jar | xargs -r kill -9 || true
            
            echo "⏳ 종료 대기 중..."
            sleep 3
            
            set -e
            echo "🚀 새 버전 실행"
            cd /home/ubuntu/ictwiki
            
            nohup java -jar \
              -Dspring.profiles.active=prod \
              wiki-0.0.1-SNAPSHOT.jar \
              > app.log 2>&1 &
            
            echo "⏳ 시작 대기 중..."
            sleep 5
            
            echo "✅ 프로세스 확인"
            if ps aux | grep -v grep | grep wiki-0.0.1-SNAPSHOT.jar > /dev/null; then
              echo "✅ 배포 성공!"
              exit 0
            else
              echo "❌ 배포 실패 - 로그 확인"
              echo "최근 로그:"
              tail -20 app.log
              exit 1
            fi