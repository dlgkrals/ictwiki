plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.7'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.graalvm.buildtools.native' version '0.10.6'
}

group = 'com.ict'
version = '0.0.1-SNAPSHOT'
description = 'ictwiki project'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

// ✅ dependencyManagement 블록 전체 제거 (spring-ai-bom 삭제)

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// 모니터링
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'


	// Spring Security
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// 이메일
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	// Guava Cache
	implementation 'com.google.guava:guava:33.0.0-jre'

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

graalvmNative {
	binaries {
		main {
			buildArgs.add('-H:+AddAllCharsets')
			buildArgs.add('-H:IncludeResourceBundles=org.apache.xmlbeans.impl.regex.message')
			buildArgs.add('-H:IncludeResources=org/apache/poi/schemas/.*')
			buildArgs.add('-H:IncludeResources=org/apache/xmlbeans/.*')
		}
	}
}